<!-- ============================================================= -->
<!--  GLÚTEOS PRO · Quiz funnel de venta                            -->
<!--  Reconstruido con el ángulo de mercado de gluteosappbrazil.site -->
<!--  (mismo flujo de 13 preguntas, misma oferta), sobre el mismo    -->

<!--  calistenia-pro. Marca, coach y tracking propios — no se reusa  -->
<!--  el nombre/foto/credenciales del "Coach Luca" del sitio         -->

<div id="sp">
  <main class="sp-stage" id="spStage"></main>
  <button class="sp-back-link" id="spBack">‹ Anterior</button>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
#sp,#sp *{box-sizing:border-box;margin:0;padding:0}
#sp{
  --bg:#FFFFFF; --bg2:#F4F4F6; --card:#F4F4F7; --card2:#FFFFFF; --line:rgba(20,10,20,.10);
  --ink:#181119; --soft:#6E6877;
  --bronze:#E0157A; --bronze2:#FF2D87; --crimson:#7C3AED; --crimson2:#9333EA;
  --shadow:0 12px 34px rgba(0,0,0,.10);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink);
  background:#FFFFFF;
  max-width:520px; margin:0 auto; min-height:84vh; position:relative;
  border-radius:18px; overflow:hidden; -webkit-font-smoothing:antialiased;
}
#sp h1,#sp h2{font-family:'Oswald',sans-serif;font-weight:700;line-height:1.12;text-transform:uppercase;letter-spacing:.01em}
#sp .cz{font-family:'Oswald',sans-serif}

/* badge (paso 1) + meta de cuestionario (pasos 2+) */
#sp .sp-badge{display:flex;align-items:center;gap:8px;width:max-content;margin:0 auto 18px;padding:6px 14px;background:rgba(255,45,135,.10);border:1px solid rgba(255,45,135,.25);border-radius:20px;font-family:'Oswald';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze2)}
#sp .sp-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--bronze2);box-shadow:0 0 8px var(--bronze2);animation:spDot 1.6s ease-in-out infinite}
@keyframes spDot{0%,100%{opacity:1}50%{opacity:.35}}
#sp .sp-meta{margin-bottom:20px}
#sp .sp-meta-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
#sp .sp-meta-tag{display:block;font-family:'Oswald';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze2);opacity:.8;margin-bottom:3px}
#sp .sp-meta-q{font-family:'Oswald';font-weight:700;font-style:italic;font-size:19px;color:var(--ink);letter-spacing:-.01em}
#sp .sp-meta-pct{font-family:monospace;font-size:12px;font-weight:700;color:var(--bronze2);background:rgba(255,45,135,.10);padding:3px 8px;border-radius:6px;height:max-content}
#sp .sp-meta-bar{height:5px;background:rgba(20,10,20,.06);border-radius:8px;overflow:hidden}
#sp .sp-meta-fill{height:100%;background:var(--bronze2);box-shadow:0 0 10px var(--bronze2);transition:width .5s cubic-bezier(.4,0,.2,1)}

#sp .sp-back-link{display:block;width:max-content;margin:16px auto 24px;background:none;border:none;color:var(--soft);font-family:'Oswald';font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;padding:6px 10px}
#sp .sp-back-link.show{opacity:.65;pointer-events:auto}
#sp .sp-back-link:hover{opacity:1}

#sp .sp-stage{padding:26px 18px 4px;animation:spIn .4s cubic-bezier(.2,.7,.2,1)}
@keyframes spIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
#sp::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);z-index:0}

/* headings */
#sp .sp-h{font-size:27px;text-align:center;margin-bottom:6px;line-height:1.14}
#sp .sp-h .am{color:var(--bronze2)}
#sp .sp-sub{text-align:center;color:var(--soft);font-size:14.5px;margin-bottom:22px}

/* option cards */
#sp .sp-grid{display:grid;gap:12px}
#sp .sp-grid.cols2{grid-template-columns:1fr 1fr}
#sp .sp-card{background:rgba(20,10,20,.04);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;text-align:left;position:relative}
#sp .sp-card:hover{transform:translateY(-3px);border-color:rgba(255,45,135,.5)}
#sp .sp-card:active{transform:scale(.98)}
#sp .sp-card.sel{border-color:var(--bronze2);box-shadow:0 0 0 2px var(--bronze2),0 0 22px rgba(255,45,135,.35);transform:translateY(-2px)}
#sp .sp-thumb{width:100%;aspect-ratio:1/1;background:linear-gradient(150deg,#1c1c1c,#101010);display:flex;align-items:center;justify-content:center;color:#555;font-size:12px;text-align:center;padding:8px;font-weight:600}
#sp .sp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
#sp .sp-card.row{display:flex;align-items:center;gap:0;padding:0}
#sp .sp-label{padding:13px 15px;font-weight:700;font-size:15.5px}
#sp .sp-cap{display:block;font-weight:500;font-size:12.5px;color:var(--soft);margin-top:2px}
#sp .sp-card.row .sp-label{padding:17px 16px}
#sp .sp-arrow{margin-left:auto;margin-right:16px;color:var(--bronze);font-size:24px;font-weight:700;line-height:1}
#sp .sp-check{margin-left:auto;margin-right:15px;width:25px;height:25px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#120F0A;transition:.15s}
#sp .sp-card.sel .sp-check{background:var(--bronze2);border-color:var(--bronze2);transform:scale(1.08)}

/* buttons */
#sp .sp-cta{display:block;width:100%;margin-top:22px;padding:17px;border:none;border-radius:13px;font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;color:#fff;cursor:pointer;background:var(--bronze2);box-shadow:0 10px 26px rgba(255,45,135,.32);transition:transform .15s,filter .2s;text-align:center;text-decoration:none;position:relative;overflow:hidden}
#sp .sp-cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:spShine 3.2s infinite}
@keyframes spShine{0%{left:-60%}55%,100%{left:130%}}
#sp .sp-cta:hover{transform:translateY(-2px);filter:brightness(1.05)}
#sp .sp-cta:disabled{opacity:.35;cursor:not-allowed;transform:none}
#sp .sp-cta:disabled::after{display:none}

/* inputs */
#sp .sp-input{width:100%;padding:17px;font-size:18px;text-align:center;font-family:inherit;color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;outline:none}
#sp .sp-input:focus{border-color:var(--bronze2);box-shadow:0 0 0 3px rgba(255,45,135,.18)}
#sp .sp-input::placeholder{color:#666}

/* interstitial / empathy */
#sp .sp-inter{text-align:center;padding:14px 0}
#sp .sp-icon{width:80px;height:80px;border-radius:50%;margin:6px auto 18px;display:flex;align-items:center;justify-content:center;font-size:36px;background:radial-gradient(circle at 35% 30%,#1c1c1c,#101010);border:1.5px solid var(--bronze);box-shadow:0 0 26px rgba(255,45,135,.25)}
#sp .sp-inter h1{font-size:25px;margin-bottom:12px}
#sp .sp-inter h1 .am{color:var(--bronze2)}
#sp .sp-inter p{color:var(--soft);font-size:15px;line-height:1.6;max-width:410px;margin:0 auto}
#sp .sp-quote{font-family:'Oswald';font-style:italic;color:var(--bronze2);font-size:15px;margin:14px auto 0;max-width:360px;opacity:.9}
#sp .sp-empathy{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--crimson2);border-radius:12px;padding:16px 18px;margin-top:18px;text-align:left;animation:spIn .35s}
#sp .sp-empathy b{color:var(--crimson2);display:block;margin-bottom:5px;font-family:'Oswald';text-transform:uppercase;font-size:14px;letter-spacing:.03em}
#sp .sp-empathy p{color:var(--soft);font-size:13.5px;line-height:1.55;margin:0}

/* result + loader */
#sp .sp-result{text-align:center}
#sp .sp-vs{display:flex;gap:12px;margin:20px 0}
#sp .sp-vs > div{flex:1;background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:18px 10px}
#sp .sp-vs .tag{font-family:'Oswald';text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:var(--soft)}
#sp .sp-vs .big{font-family:'Oswald';font-weight:800;font-size:30px;margin:8px 0 2px}
#sp .sp-vs.now .big{color:var(--crimson2)} #sp .sp-vs.goal .big{color:var(--bronze2)}
#sp .sp-score{font-family:'Oswald';font-weight:800;font-size:58px;color:var(--bronze2);line-height:1;margin:8px 0;text-shadow:0 0 26px rgba(255,45,135,.3)}
#sp .sp-vsbox{display:flex;gap:12px;margin:18px 0}
#sp .sp-vsbox > div{flex:1;background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center}
#sp .sp-vsbox .lab{font-family:'Oswald';text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--soft)}
#sp .sp-vsbox .v{font-family:'Oswald';font-weight:800;font-size:21px;margin-top:5px}
#sp .sp-vsbox.wrap{gap:12px}
#sp .sp-vsbox .nowb .v{color:var(--crimson2)} #sp .sp-vsbox .goalb .v{color:var(--bronze2)}
#sp .sp-metric{margin:14px 0;text-align:left}
#sp .sp-metric .ml{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;color:var(--soft);font-weight:600}
#sp .sp-track2{height:14px;background:#EFEFF3;border-radius:8px;overflow:hidden}
#sp .sp-fill2{height:100%;width:0;border-radius:8px;transition:width 1.3s cubic-bezier(.2,.7,.2,1)}
#sp .sp-fill2.now{background:linear-gradient(90deg,#7a2a22,var(--crimson2))}
#sp .sp-fill2.goal{background:linear-gradient(90deg,var(--bronze),var(--bronze2));box-shadow:0 0 14px rgba(255,45,135,.4)}
#sp .sp-attack{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bronze);border-radius:12px;padding:15px 16px;margin:18px 0;text-align:left}
#sp .sp-attack b{font-family:'Oswald';text-transform:uppercase;color:var(--bronze2);font-size:13px;display:block;margin-bottom:9px;letter-spacing:.03em}
#sp .sp-attack .z{display:flex;align-items:center;gap:9px;font-size:14.5px;margin:6px 0;opacity:0;transform:translateX(-10px);transition:opacity .4s,transform .4s}
#sp .sp-attack .z.in{opacity:1;transform:none}
#sp .sp-attack .z .ck{color:var(--bronze2);font-weight:800}
#sp .sp-loader{text-align:center;padding:34px 0}
#sp .sp-forge{font-size:42px;animation:spPulse 1s ease-in-out infinite}
@keyframes spPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,45,135,0))}50%{transform:scale(1.12);filter:drop-shadow(0 0 14px rgba(255,45,135,.6))}}
#sp .sp-ring{font-family:'Oswald';font-weight:800;font-size:44px;color:var(--bronze2);margin-top:10px}
#sp .sp-ltrack{height:9px;background:#EFEFF3;border-radius:6px;overflow:hidden;margin:18px 0}
#sp .sp-lfill{height:100%;width:0;background:linear-gradient(90deg,var(--crimson),var(--bronze2));transition:width .25s}

/* SALES */
#sp .sp-timer{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,var(--crimson),var(--crimson2));color:#fff;text-align:center;padding:11px;font-family:'Oswald';font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
#sp .sp-timer span{font-family:'Oswald';font-weight:800;margin-left:6px}
#sp .sp-salebody{padding:26px 18px 42px}
#sp .sp-hero-img{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,#1c1c1c,#101010);display:flex;align-items:center;justify-content:center;color:#555;font-size:13px;margin:14px 0;border:1px solid var(--line)}
#sp .sp-hero-img img{width:100%;height:100%;object-fit:cover}
#sp .sp-won{background:linear-gradient(140deg,#FFE8F3,#FFF0F8);border:1px solid var(--bronze);border-radius:12px;padding:14px;text-align:center;margin-bottom:8px;box-shadow:0 0 22px rgba(255,45,135,.15)}
#sp .sp-won b{font-family:'Oswald';font-weight:800;color:var(--bronze2)}
#sp .sp-sec{margin:26px 0}
#sp .sp-sec-h{font-family:'Oswald';font-weight:800;text-transform:uppercase;font-size:20px;text-align:center;margin-bottom:16px;letter-spacing:.02em}
#sp .sp-sec-h .am{color:var(--bronze2)}
#sp .sp-incl{list-style:none;display:grid;gap:10px}
#sp .sp-incl li{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:14px}
#sp .sp-incl li .ck{color:var(--bronze2);font-weight:800;flex:none}
#sp .sp-how{display:grid;gap:13px}
#sp .sp-how .st{display:flex;gap:13px;align-items:flex-start}
#sp .sp-how .num{width:40px;height:40px;flex:none;border-radius:50%;background:linear-gradient(140deg,var(--bronze2),var(--bronze));color:#0f120f;font-family:'Oswald';font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
#sp .sp-how .st b{font-family:'Oswald';text-transform:uppercase;font-size:15.5px;display:block;margin-bottom:2px}
#sp .sp-how .st p{color:var(--soft);font-size:13.5px;margin:0;line-height:1.45}
#sp .sp-tst{display:grid;gap:12px}
#sp .sp-tst .c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#sp .sp-tst .stars{color:var(--bronze2);font-size:13px;letter-spacing:2px}
#sp .sp-tst .q{font-size:13.5px;line-height:1.55;margin:6px 0 8px}
#sp .sp-tst .who{display:flex;justify-content:space-between;font-size:12.5px}
#sp .sp-tst .who b{font-family:'Oswald';text-transform:uppercase}
#sp .sp-tst .who .res{color:var(--bronze2);font-weight:700}
#sp .sp-tier{display:block;width:100%;text-align:left;background:linear-gradient(165deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
#sp .sp-tier.sel{border-color:var(--bronze2);box-shadow:0 0 0 2px var(--bronze2),0 0 18px rgba(255,45,135,.22)}
#sp .sp-tier.pop{border-color:var(--bronze)}
#sp .sp-pop{position:absolute;top:-11px;left:16px;background:linear-gradient(140deg,var(--crimson2),var(--crimson));color:#fff;font-family:'Oswald';font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;padding:3px 11px;border-radius:20px}
#sp .sp-tier-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#sp .sp-tier-name{font-family:'Oswald';font-weight:700;text-transform:uppercase;font-size:16px}
#sp .sp-tier-old{color:var(--soft);text-decoration:line-through;font-size:13px;margin-right:6px}
#sp .sp-tier-now{font-weight:700;font-size:15px}
#sp .sp-off{display:inline-block;background:var(--crimson);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:5px}
#sp .sp-perday{text-align:right;flex:none}
#sp .sp-perday .pd{font-family:'Oswald';font-weight:800;font-size:25px;line-height:1;color:var(--bronze2)}
#sp .sp-perday .u{font-size:11px;color:var(--soft)}
#sp .sp-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-right:12px;display:inline-block;vertical-align:middle}
#sp .sp-tier.sel .sp-radio{border-color:var(--bronze2);background:radial-gradient(circle,var(--bronze2) 40%,transparent 46%)}
#sp .sp-bonus{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--bronze2);font-weight:600}
#sp .sp-guar{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:18px 0;font-size:13px;color:var(--soft)}
#sp .sp-guar .g-ic{font-size:26px}
#sp .sp-proof{text-align:center;color:var(--soft);font-size:13px;margin-top:14px}
#sp .sp-proof b{color:var(--ink)}
#sp .sp-faq .it{border-bottom:1px solid var(--line)}
#sp .sp-faq .q{width:100%;text-align:left;background:none;border:none;color:var(--ink);font-family:'Oswald';text-transform:uppercase;font-size:14.5px;font-weight:600;padding:15px 28px 15px 0;cursor:pointer;position:relative}
#sp .sp-faq .q::after{content:'+';position:absolute;right:4px;top:13px;font-size:20px;color:var(--bronze2)}
#sp .sp-faq .it.open .q::after{content:'–'}
#sp .sp-faq .a{max-height:0;overflow:hidden;transition:max-height .25s ease;color:var(--soft);font-size:13.5px;line-height:1.55}
#sp .sp-faq .it.open .a{max-height:260px;padding-bottom:14px}
#sp .sp-disc{font-size:10.5px;color:#666;text-align:center;margin-top:18px;line-height:1.5}
#sp .sp-auth{text-align:center;margin:24px 0}
#sp .sp-laurel{font-family:'Oswald';font-weight:800;font-size:36px;color:var(--bronze2);display:flex;align-items:center;justify-content:center;gap:10px}
#sp .sp-laurel .lf{opacity:.85;font-size:30px}
#sp .sp-auth-sub{color:var(--soft);font-size:13px;margin-top:2px}
#sp .sp-stars{font-size:18px;color:var(--bronze2);margin-top:14px;letter-spacing:2px}
#sp .sp-stars b{color:var(--ink);font-family:'Oswald'}
#sp .sp-pay{text-align:center;margin:14px 0 4px}
#sp .sp-pay > span{font-size:12px;color:var(--soft);display:block;margin-bottom:8px}
#sp .sp-cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#sp .sp-cards span{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-family:'Oswald';font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--ink)}
@media(max-width:430px){#sp .sp-grid.cols2{grid-template-columns:1fr}}
</style>

<!-- ===== Componentes (slider / proyección / medidor) ===== -->
<style>
#sp .sp-sl-wrap{display:flex;flex-direction:column;align-items:center;width:100%;padding:12px 0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
#sp .sp-sl-val{font-family:'Oswald',sans-serif;font-size:2.6rem;font-weight:700;color:var(--ink);letter-spacing:.02em;margin-bottom:18px;line-height:1}
#sp .sp-sl-track-wrap{position:relative;width:100%;height:44px;display:flex;align-items:center;cursor:pointer}
#sp .sp-sl-track{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:var(--line);overflow:visible}
#sp .sp-sl-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--bronze),var(--bronze2));pointer-events:none}
#sp .sp-sl-ticks{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);pointer-events:none}
#sp .sp-sl-tick{position:absolute;width:2px;height:10px;background:var(--line);border-radius:1px;transform:translate(-50%,-50%)}
#sp .sp-sl-tick.sp-sl-tick-filled{background:var(--bronze2);opacity:.5}

<script>
function spSlider(opts){
  var o=Object.assign({min:0,max:100,value:50,step:1,unit:'',accent:null},opts);
  var cur=Math.min(o.max,Math.max(o.min,o.value));
  var wrap=document.createElement('div');wrap.className='sp-sl-wrap';wrap.setAttribute('tabindex','0');
  var val=document.createElement('div');val.className='sp-sl-val';
  var tw=document.createElement('div');tw.className='sp-sl-track-wrap';
  var track=document.createElement('div');track.className='sp-sl-track';
  var fill=document.createElement('div');fill.className='sp-sl-fill';
  var ticks=document.createElement('div');ticks.className='sp-sl-ticks';
  var thumb=document.createElement('div');thumb.className='sp-sl-thumb';
  var steps=Math.round((o.max-o.min)/o.step);
  var maxTicks=20;var tickEvery=Math.max(1,Math.ceil(steps/maxTicks));
  for(var i=0;i<=steps;i+=tickEvery){
    var t=document.createElement('div');t.className='sp-sl-tick';
    t.style.left=(i/steps*100)+'%';ticks.appendChild(t);
  }
  track.appendChild(fill);track.appendChild(ticks);track.appendChild(thumb);tw.appendChild(track);
  wrap.appendChild(val);wrap.appendChild(tw);
  function pct(){return(cur-o.min)/(o.max-o.min)}

    var p=pct()*100;fill.style.width=p+'%';thumb.style.left=p+'%';
    var ts=ticks.querySelectorAll('.sp-sl-tick');var fi=pct()*steps/tickEvery;

  }

  function clamp(v){return Math.min(o.max,Math.max(o.min,v))}

  document.addEventListener('mousemove',function(e){onMove(e.clientX);});
  document.addEventListener('mouseup',function(){drag=false;});
  thumb.addEventListener('touchstart',function(e){drag=true;e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',function(e){if(drag){onMove(e.touches[0].clientX);}},{passive:true});
  document.addEventListener('touchend',function(){drag=false;});

  });

  render();return wrap;
}
// Slider tipo "cinta métrica/regla": el centro queda fijo (marcado por los
// dos triángulos) y la tira de marcas se desliza por debajo al arrastrar,
// igual que el selector de altura/peso del funnel original.
function spRuler(opts){
  var o=Object.assign({min:0,max:100,value:50,step:1,unit:''},opts);
  var cur=Math.min(o.max,Math.max(o.min,o.value));
  var PX=40; // px por unidad, igual al original
  var wrap=document.createElement('div');wrap.className='sp-rl-wrap';wrap.setAttribute('tabindex','0');
  var val=document.createElement('div');val.className='sp-rl-val';
  var capTop=document.createElement('div');capTop.className='sp-rl-center top';
  var track=document.createElement('div');track.className='sp-rl-track';
  var inner=document.createElement('div');inner.className='sp-rl-inner';
  var capBot=document.createElement('div');capBot.className='sp-rl-center bot';
  var hint=document.createElement('div');hint.className='sp-rl-hint';hint.textContent='Arrastra para ajustar';
  var n=Math.round((o.max-o.min)/o.step);
  for(var i=0;i<=n;i++){
    var v=o.min+i*o.step;
    var t=document.createElement('div');t.className='sp-rl-tick';t.style.left=(i*PX)+'px';
    var major=(Math.round(v)%10===0), mid=(Math.round(v)%5===0);
    var line=document.createElement('div');line.className='sp-rl-line'+(major?' major':mid?' mid':'');
    t.appendChild(line);
    if(major){ var lab=document.createElement('div');lab.className='sp-rl-label';lab.textContent=Math.round(v);t.appendChild(lab); }
    inner.appendChild(t);
  }
  track.appendChild(inner);
  wrap.appendChild(val);wrap.appendChild(capTop);wrap.appendChild(track);wrap.appendChild(capBot);wrap.appendChild(hint);
  function render(){
    val.innerHTML=cur+'<span class="u">'+(o.unit||'')+'</span>';
    var offset=(cur-o.min)*PX;
    // OJO: "50%" en translateX() se calcula sobre el ancho del propio elemento
    // (que es enorme, son todas las marcas), no del track visible. Por eso
    // medimos el ancho REAL del track en px y centramos con eso.
    var half=track.clientWidth/2;
    inner.style.transform='translateX('+(half-offset)+'px)';
  }
  function clampSnap(v){ v=Math.round((v-o.min)/o.step)*o.step+o.min; return Math.min(o.max,Math.max(o.min,v)); }
  var dragging=false,startX=0,startVal=0,lastVal=cur;
  function pos(e){ return e.touches?e.touches[0].clientX:e.clientX; }
  function onDown(e){ dragging=true; startX=pos(e); startVal=cur; }
  function onMove(e){ if(!dragging)return; var dx=pos(e)-startX; var v=clampSnap(startVal-dx/PX*o.step);

  document.addEventListener('mouseup',onUp);
  track.addEventListener('touchstart',function(e){onDown(e);},{passive:true});
  document.addEventListener('touchmove',onMove,{passive:true});
  document.addEventListener('touchend',onUp);
  wrap.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){cur=clampSnap(cur+o.step);render();e.preventDefault();}
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){cur=clampSnap(cur-o.step);render();e.preventDefault();}
  });
  wrap.getValue=function(){return cur;};
  // El track todavía no tiene ancho real (no está montado en el DOM) en el
  // primer render(); se corrige apenas se monta, vía requestAnimationFrame.
  wrap.refresh=render;
  render();return wrap;
}

    if(p<0.002){arcEl.setAttribute('d','');}else{arcEl.setAttribute('d','M'+start.x+','+start.y+' A'+r+','+r+' 0 '+lf+',1 '+end.x+','+end.y);}
    var na=(angle-180)*Math.PI/180;needle.setAttribute('x2',cx+needleLen*Math.cos(na));needle.setAttribute('y2',cy+needleLen*Math.sin(na));valDiv.textContent=Math.round(p*value);}
  update(0);
  var obs=new IntersectionObserver(function(en){if(!en[0].isIntersecting)return;obs.disconnect();var dur=1300,start=null;
    function frame(now){if(!start)start=now;var t=Math.min((now-start)/dur,1),ease=1-Math.pow(1-t,3);update(ease);if(t<1)requestAnimationFrame(frame);else update(1);}requestAnimationFrame(frame);},{threshold:.2});
  obs.observe(wrap);

}
</script>

var AR_FIXED_PRICE_ARS = 14924; // Argentina: precio fijo, nunca se calcula por cotizacion.
var FALLBACK_RATES = {
  USD:1, ARS:1050, BRL:5.6, COP:4300, MXN:18.6, CLP:970, PEN:3.76, UYU:42,
  PYG:7750, BOB:6.94, VES:47, CRC:512, PAB:1, GTQ:7.7, HNL:25.6, NIO:36.8,
  DOP:60.5, EUR:0.92, GBP:0.79, CAD:1.38, AUD:1.52, INR:83.9
};
var LOCALE_BY_COUNTRY = {
  AR:'es-AR', BR:'pt-BR', CO:'es-CO', MX:'es-MX', CL:'es-CL', PE:'es-PE',
  UY:'es-UY', PY:'es-PY', BO:'es-BO', VE:'es-VE', CR:'es-CR', PA:'es-PA',
  GT:'es-GT', HN:'es-HN', SV:'es-SV', NI:'es-NI', DO:'es-DO', EC:'es-EC',
  US:'en-US', ES:'es-ES', GB:'en-GB', CA:'en-CA', AU:'en-AU', IN:'en-IN'
};
var ZERO_DECIMAL_CUR = {ARS:1,COP:1,CLP:1,PYG:1,VES:1};
function fetchWithTimeout(url, ms){
  return Promise.race([
    fetch(url),
    new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })
  ]);
}
function detectCurrency(){
  return new Promise(function(resolve){
    var done=false;
    function finish(cur){ if(done) return; done=true; resolve(cur); }
    function withRate(code, country){
      code = (code||'USD').toUpperCase();
      if(code==='USD'){ finish({code:'USD', rate:1, locale:LOCALE_BY_COUNTRY[country]||'en-US', country:country||''}); return; }
      fetchWithTimeout('https://open.er-api.com/v6/latest/USD', 3500)
        .then(function(r){ return r.json(); })
        .then(function(d){
          var rate = d && d.rates && d.rates[code];
          if(!rate) rate = FALLBACK_RATES[code];
          finish(rate ? {code:code, rate:rate, locale:LOCALE_BY_COUNTRY[country]||'en-US', country:country||''} : {code:'USD', rate:1, locale:'en-US', country:country||''});
        })
        .catch(function(){
          var rate = FALLBACK_RATES[code];
          finish(rate ? {code:code, rate:rate, locale:LOCALE_BY_COUNTRY[country]||'en-US', country:country||''} : {code:'USD', rate:1, locale:'en-US', country:country||''});
        });
    }
    fetchWithTimeout('https://ipapi.co/json/', 3000)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.currency && d.country_code){ withRate(d.currency, d.country_code); }
        else { throw new Error('sin moneda'); }
      })
      .catch(function(){
        fetchWithTimeout('https://ipwho.is/', 3000)
          .then(function(r){ return r.json(); })
          .then(function(d){
            var code = d && d.currency && d.currency.code;
            var country = d && d.country_code;
            if(code && country){ withRate(code, country); }
            else { finish({code:'USD', rate:1, locale:'en-US', country:''}); }
          })
          .catch(function(){ finish({code:'USD', rate:1, locale:'en-US', country:''}); });
      });
    setTimeout(function(){ finish({code:'USD', rate:1, locale:'en-US', country:''}); }, 5000);
  });
}
function fmtPrice(usd){
  if(!CURRENCY.ready || CURRENCY.code==='USD' || !CURRENCY.rate){ return '$'+usd.toFixed(2); }
  var amount = usd*CURRENCY.rate;
  try{
    return new Intl.NumberFormat(CURRENCY.locale, {
      style:'currency', currency:CURRENCY.code,
      maximumFractionDigits: ZERO_DECIMAL_CUR[CURRENCY.code] ? 0 : 2,
      minimumFractionDigits: ZERO_DECIMAL_CUR[CURRENCY.code] ? 0 : 2
    }).format(amount);
  }catch(e){ return '$'+usd.toFixed(2); }
}
function fmtNowPrice(usd){
  // Argentina: precio fijo en pesos argentinos, nunca se recalcula por cotizacion del dolar.
  if(CURRENCY.country==='AR'){
    try{
      return new Intl.NumberFormat('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0, minimumFractionDigits:0 }).format(AR_FIXED_PRICE_ARS);
    }catch(e){ return '$'+AR_FIXED_PRICE_ARS; }
  }
  return fmtPrice(usd);
}

(function initCurrency(){

})();

  if(s.type==='commit'){
    html+='<div class="sp-grid">';
    s.opts.forEach(function(o,idx){ html+='<div class="sp-card row" data-i="'+idx+'"><div class="sp-label">'+esc(o.t)+'</div></div>'; });
    html+='</div>'; stage.innerHTML=html;
    stage.querySelectorAll('.sp-card').forEach(function(c){ c.onclick=function(){ c.classList.add('sel'); setTimeout(function(){go(state.i+1);},260); }; });
    return;
  }
  if(s.type==='slider'){
    html+='<div id="spSliderHost"></div><button class="sp-cta" id="spNext">Continuar →</button>';
    stage.innerHTML=html;
    var sl=spRuler({min:s.min,max:s.max,value:s.value,step:s.step||1,unit:s.unit||''});
    document.getElementById('spSliderHost').appendChild(sl);
    requestAnimationFrame(function(){ sl.refresh(); });
    document.getElementById('spNext').onclick=function(){ state.answers[s.key||state.i]=sl.getValue(); go(state.i+1); };
    return;
  }
  if(s.type==='input'){
    html+='<input class="sp-input" id="spInput" placeholder="'+esc(s.placeholder||'')+'" autocomplete="off">';
    html+='<button class="sp-cta" id="spNext" disabled>Continuar →</button>';
    stage.innerHTML=html;
    var inp=document.getElementById('spInput'), nx=document.getElementById('spNext'); inp.focus();
    inp.oninput=function(){ nx.disabled=!inp.value.trim(); };
    inp.onkeydown=function(e){ if(e.key==='Enter'&&inp.value.trim()) nx.click(); };
    nx.onclick=function(){ if(s.key) state.answers[s.key]=inp.value.trim(); go(state.i+1); };
    return;
  }
}

// Loader tipo checklist (igual al del funnel original): una lista de pasos
// que se van tildando en vivo mientras avanza una barra de progreso.
function runLoader(){
  backBtn.classList.remove('show');
  var steps=['Analizando tus respuestas','Preparando los 28 días','Calculando tu potencial','Preparando tu plan personalizado'];
  var rows=steps.map(function(t,idx){
    return '<div class="sp-lc-row" data-i="'+idx+'"><span class="sp-lc-ic">○</span><span class="sp-lc-label">'+esc(t.toUpperCase())+'</span></div>';
  }).join('');
  stage.style.padding='26px 18px 4px';
  stage.innerHTML='<div class="sp-loader2">'+
    '<div class="sp-badge"><span class="dot"></span>Análisis en curso</div>'+
    '<h1 class="sp-h">Analizando tus <span class="am">respuestas</span></h1>'+
    '<p class="sp-sub">Procesando tu perfil personalizado...</p>'+
    '<div class="sp-lc-status"><span>Estado: <b id="spLState">Analizando</b></span><span id="spLPct">0%</span></div>'+
    '<div class="sp-ltrack"><div class="sp-lfill" id="spLF"></div></div>'+
    '<div class="sp-lc-list">'+rows+'</div>'+
    '<p class="sp-lc-footer">Análisis seguro · Sin compromiso · Gratuito</p></div>';
  var rowsEl=stage.querySelectorAll('.sp-lc-row'), n=rowsEl.length;
  var p=0;
  var iv=setInterval(function(){
    p+=Math.random()*6+2; if(p>=100)p=100;
    document.getElementById('spLPct').textContent=Math.floor(p)+'%';
    document.getElementById('spLF').style.width=p+'%';
    var active=Math.min(n-1, Math.floor(p/100*n));
    rowsEl.forEach(function(r,idx){
      var ic=r.querySelector('.sp-lc-ic');
      if(idx<active){ r.classList.add('done'); r.classList.remove('active'); ic.textContent='✓'; }
      else if(idx===active){ r.classList.add('active'); ic.textContent='●'; }
    });
    if(p>=100){
      clearInterval(iv);
      rowsEl.forEach(function(r){ r.classList.add('done'); r.classList.remove('active'); r.querySelector('.sp-lc-ic').textContent='✓'; });
      setTimeout(renderApproved,550);
    }
  },180);
}
// Pantalla "PERFIL ANALIZADO" (equivalente a la del funnel original): informe
// final con 3 features + botón para pasar a la presentación del coach y
// luego al gate de video.
function renderApproved(){
  stage.style.padding='24px 18px 42px';
  var id='#'+Math.floor(10+Math.random()*89)+'X-'+Math.floor(100+Math.random()*899);
  stage.innerHTML='<div class="sp-approved">'+
    '<div class="sp-icon" style="margin:0 auto 18px">✨</div>'+
    '<h1 class="sp-h">¡Análisis <span class="am">completado</span>!</h1>'+
    '<p class="sp-sub">Tu perfil fue analizado y ya tenemos tu plan personalizado listo.</p>'+
    '<div class="sp-report">'+
      '<div class="sp-report-top"><span>Perfil analizado</span><span>ID: '+id+'</span></div>'+
      '<div class="sp-report-row"><span class="ic">📋</span><div><b>Plan generado</b><p>Rutina adaptada a tu edad, tu objetivo y el tiempo que dijiste tener disponible.</p></div></div>'+
      '<div class="sp-report-row"><span class="ic">🎥</span><div><b>Acceso a videos</b><p>Ejecución paso a paso de cada ejercicio, sin gimnasio.</p></div></div>'+
      '<div class="sp-report-row"><span class="ic">🛡️</span><div><b>Garantía de resultados</b><p>45 días de garantía de devolución si seguís el plan y no ves cambios.</p></div></div>'+
    '</div>'+
    '<button class="sp-cta" id="spAccess">Ver mi plan 🔓</button></div>';
  document.getElementById('spAccess').onclick=renderCoach;
}
// Presentación del coach (mismo layout que el sitio analizado: dos fotos
// lado a lado + bio + estrellas + cantidad de alumnas + botón). Es una
// persona ficticia propia de Glúteos Pro — no se reusa el nombre, las
// fotos ni las credenciales del "Coach Luca" del sitio analizado (ver
// README.md): esas dos fotos puntuales sí se reemplazan por fotos de
// stock, porque reusar la cara/nombre real de otra persona como si avalara
// este producto sería suplantación de identidad.
function renderCoach(){
  stage.style.padding='24px 18px 42px';
  var photos=(CONFIG.IMG.coach||[]).map(function(src){
    return '<div class="sp-coach-ph"><img src="'+src+'" alt=""></div>';
  }).join('');
  var photosSec=photos?'<div class="sp-coach-photos">'+photos+'</div>':'';
  stage.innerHTML='<div class="sp-approved" style="text-align:center">'+
    '<div class="sp-badge" style="margin:0 auto 14px"><span class="dot"></span>Tu coach</div>'+
    '<h1 class="sp-h">'+esc(CONFIG.COACH_NAME)+'</h1>'+
    '<p class="sp-sub" style="text-transform:uppercase;letter-spacing:.04em;font-weight:600">'+esc(CONFIG.COACH_TITLE)+'</p>'+
    photosSec+
    '<p style="color:var(--soft);font-size:14px;line-height:1.6;max-width:400px;margin:14px auto 0">Especializada en entrenamiento de activación de glúteos para mujeres, con rutinas cortas pensadas para hacer en casa sin equipamiento.</p>'+
    '<div style="margin-top:22px">'+
      '<p style="font-family:\'Oswald\';font-weight:700;color:var(--bronze2);text-transform:uppercase;letter-spacing:.04em;font-size:14px">Resultados reales 🍑</p>'+
      '<p style="font-size:20px;letter-spacing:2px;color:var(--bronze2);margin:4px 0">★★★★★</p>'+
      '<p style="color:var(--soft);font-size:13px">+50.000 alumnas</p>'+
    '</div>'+
    '<button class="sp-cta" id="spAccess2" style="margin-top:14px">Quiero empezar ahora →</button></div>';
  document.getElementById('spAccess2').onclick=renderVideoGate;
}
// Gate de video (placeholder hasta tener el video real) con botón para
// saltarlo y pasar directo a la oferta.
function renderVideoGate(){
  stage.style.padding='24px 18px 42px';
  stage.innerHTML='<div class="sp-videogate">'+
    '<p class="sp-sub">Tu video ha comenzado, mirálo y desbloqueá el plan.</p>'+
    '<div class="sp-video-box">🎥<span>Video próximamente<br>(placeholder)</span></div>'+
    '<button class="sp-cta" id="spSkipVideo" style="margin-top:20px">Pasar sin video →</button></div>';
  document.getElementById('spSkipVideo').onclick=renderSale;
}

function renderSale(){
  backBtn.style.display='none';
  var name=state.answers.name?esc(state.answers.name):'vos';
  var brand=esc(CONFIG.BRAND_PLAIN);
  var hero=CONFIG.IMG.sale_hero?'<img src="'+CONFIG.IMG.sale_hero+'" alt="">':'IMAGEN DEL PLAN';
  var tiers='';
  CONFIG.TIERS.forEach(function(t,idx){
    var offPct=t.oldUsd?Math.round((1-t.nowUsd/t.oldUsd)*100)+'% OFF':'';
    tiers+='<div class="sp-tier'+(t.popular?' pop':'')+(idx===state.tier?' sel':'')+'" data-i="'+idx+'">'+
      (t.popular?'<span class="sp-pop">★ Más elegido</span>':'')+
      '<div class="sp-tier-row"><div><span class="sp-radio"></span>'+
      '<span class="sp-tier-name">'+esc(t.name)+'</span><br>'+
      (t.oldUsd?'<span class="sp-tier-old" id="tierOld">'+fmtPrice(t.oldUsd)+'</span>':'')+'<span class="sp-tier-now" id="tierNow">'+fmtNowPrice(t.nowUsd)+'</span>'+
      (offPct?'<br><span class="sp-off">'+offPct+'</span>':'')+
      '</div><div class="sp-perday"><div class="pd">🔓</div><div class="u">DE POR VIDA</div></div></div>'+
      (t.bonus?'<div class="sp-bonus">'+esc(t.bonus)+'</div>':'')+'</div>';
  });
  var incl=(CONFIG.INCLUDES||[]).map(function(x){return '<li><span class="ck">✔</span><span>'+esc(x)+'</span></li>';}).join('');
  var inclSec=incl?'<div class="sp-sec"><h2 class="sp-sec-h">Qué incluye tu <span class="am">'+brand+'</span></h2><ul class="sp-incl">'+incl+'</ul></div>':'';
  var progSec=CONFIG.IMG.program?'<div class="sp-sec"><h2 class="sp-sec-h">Tu <span class="am">plan</span></h2><div class="sp-hero-img" style="aspect-ratio:3/2">'+'<img src="'+CONFIG.IMG.program+'" alt="">'+'</div></div>':'';
  var how=(CONFIG.HOW||[]).map(function(s){return '<div class="st"><div class="num">'+esc(s.n)+'</div><div><b>'+esc(s.t)+'</b><p>'+esc(s.d)+'</p></div></div>';}).join('');
  var howSec=how?'<div class="sp-sec"><h2 class="sp-sec-h">El <span class="am">camino</span></h2><div class="sp-how">'+how+'</div></div>':'';
  var bonuses=(CONFIG.BONUSES||[]).map(function(x){return '<li><span class="ck">🎁</span><span><b>'+esc(x.t)+'</b> — '+esc(x.d)+' <span style="color:var(--soft)">(valor '+esc(x.value)+')</span></span></li>';}).join('');
  var bonusSec=bonuses?'<div class="sp-sec"><h2 class="sp-sec-h">Bonos <span class="am">exclusivos</span></h2><ul class="sp-incl">'+bonuses+'</ul></div>':'';
  var tst=(CONFIG.TESTIMONIALS||[]).map(function(x){return '<div class="c"><div class="stars">★★★★★</div><p class="q">"'+esc(x.text)+'"</p><div class="who"><b>'+esc(x.name)+'</b><span class="res">'+esc(x.result)+'</span></div></div>';}).join('');
  var tstSec=tst?'<div class="sp-sec"><h2 class="sp-sec-h">Historias <span class="am">reales</span></h2><div class="sp-tst">'+tst+'</div></div>':'';
  var faq=(CONFIG.FAQ||[]).map(function(x){return '<div class="it"><button class="q">'+esc(x.q)+'</button><div class="a">'+esc(x.a)+'</div></div>';}).join('');
  var faqSec=faq?'<div class="sp-sec sp-faq"><h2 class="sp-sec-h">Preguntas <span class="am">frecuentes</span></h2>'+faq+'</div>':'';
  var authority='<div class="sp-sec sp-auth"><div class="sp-laurel"><span class="lf">🍑</span><span>+12.400</span><span class="lf">🍑</span></div>'+
    '<div class="sp-auth-sub">mujeres empezaron su plan este mes</div>'+
    '<div class="sp-stars">★★★★★ <b>4.8</b>/5</div><div class="sp-auth-sub">basado en +9.200 valoraciones</div></div>';
  var pay='<div class="sp-pay"><span>🔒 Pago 100% seguro y encriptado</span><div class="sp-cards"><span>VISA</span><span>Mastercard</span><span>Amex</span><span>PayPal</span></div></div>';

  stage.style.padding='0';
  stage.innerHTML='<div class="sp-sale">'+
    '<div class="sp-timer">⏳ La oferta vence en <span id="spClock">'+CONFIG.TIMER_MIN+':00</span></div>'+
    '<div class="sp-salebody">'+
    '<h1 class="sp-h">Tu '+brand+'</h1>'+
    '<p class="sp-sub">Armado según tus respuestas</p>'+
    '<div class="sp-hero-img">'+hero+'</div>'+
    '<div class="sp-won">🎉 <b>¡Ganaste el mayor descuento!</b><br><span style="font-size:13px;color:var(--soft)">Aplicado a tu plan por tiempo limitado</span></div>'+
    inclSec + bonusSec + progSec + howSec +
    '<div class="sp-sec"><h2 class="sp-sec-h">Elegí tu <span class="am">plan</span></h2>'+tiers+
    '<a class="sp-cta" id="spBuy" href="#">QUIERO MI TRANSFORMACIÓN AHORA</a></div>'+
    pay +
    '<div class="sp-guar"><span class="g-ic">🛡️</span><div><b style="color:var(--ink)">Garantía de devolución · 45 días.</b> Si seguís el plan y no ves resultados visibles, te devolvemos el 100%. Sin preguntas.</div></div>'+
    authority + tstSec + faqSec +
    '<div class="sp-proof"><b>+12.400 mujeres</b> ya empezaron su transformación este mes</div>'+
    '<p class="sp-disc">*Resultados ilustrativos, no garantizados. Los resultados individuales varían según constancia, alimentación y metabolismo. Consultá a un profesional de la salud antes de empezar cualquier programa de ejercicio.</p>'+
    '</div></div>';

  function paint(){ stage.querySelectorAll('.sp-tier').forEach(function(el){ el.classList.toggle('sel',+el.dataset.i===state.tier); }); upd(); }
  function checkoutUrlWithParams(){
    var base=CONFIG.STORE||'#';
    var search=window.location.search;
    if(!search) return base;
    var sep = base.indexOf('?')>-1 ? '&' : '?';
    return base+sep+search.replace(/^\?/,'');
  }
  function upd(){
    var b=document.getElementById('spBuy');
    b.href=checkoutUrlWithParams();
    if(!b.dataset.tracked){
      b.dataset.tracked='1';
      b.addEventListener('click', function(e){
        e.preventDefault();
        window.location.href=checkoutUrlWithParams();
      });
    }
  }
  stage.querySelectorAll('.sp-tier').forEach(function(el){ el.onclick=function(){ state.tier=+el.dataset.i; paint(); }; });
  stage.querySelectorAll('.sp-faq .q').forEach(function(b){ b.onclick=function(){ b.parentElement.classList.toggle('open'); }; });
  upd();
  var total=CONFIG.TIMER_MIN*60, clock=document.getElementById('spClock');
  var ci=setInterval(function(){ total--; if(total<0){clearInterval(ci);return;} var m=Math.floor(total/60),s=total%60; clock.textContent=m+':'+(s<10?'0':'')+s; },1000);
  window.scrollTo({top:0,behavior:'smooth'});
}

renderLanding();
})();
</script>
